<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymManagerPro · Key Generator</title>
  <!-- Inter font & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #0b1120 0%, #111b2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      background: #1a263b;
      border-radius: 2.5rem;
      padding: 2.8rem 2.8rem;
      max-width: 820px;
      width: 100%;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.02) inset;
      backdrop-filter: blur(2px);
      transition: all 0.2s ease;
      border: 1px solid #2e3d5a;
    }

    /* subtle glow */
    .card::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
      opacity: 0.5;
      border-radius: 100%;
      filter: blur(1px);
    }
    .card {
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #2d3f5e;
      color: #b9d0f0;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      padding: 0.3rem 1.2rem 0.3rem 1rem;
      border-radius: 40px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      border: 1px solid #3b5280;
      backdrop-filter: blur(4px);
    }
    .badge span {
      opacity: 0.7;
    }

    .header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    h1 {
      color: #f0f4ff;
      font-weight: 700;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    h1 small {
      font-size: 1rem;
      font-weight: 400;
      color: #7f9bcb;
      letter-spacing: 0.02em;
      background: #1f314a;
      padding: 0.1rem 0.9rem;
      border-radius: 40px;
      border: 1px solid #314a6b;
    }

    .subhead {
      color: #a5bbdd;
      font-size: 0.95rem;
      margin-bottom: 2.2rem;
      border-left: 3px solid #3b82f6;
      padding-left: 1.2rem;
      font-weight: 400;
      background: linear-gradient(90deg, rgba(59,130,246,0.06), transparent);
      border-radius: 0 12px 12px 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .subhead .pill {
      background: #1d314b;
      color: #8eb0e6;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.9rem;
      border-radius: 30px;
      margin-left: 0.2rem;
      border: 1px solid #2f4a70;
      letter-spacing: 0.02em;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    .inline-group {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1 1 0;
      min-width: 140px;
    }

    .field label {
      color: #cbdef5;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: uppercase;
    }
    .field label .unit-badge {
      background: #1f3250;
      color: #8db2ed;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.05rem 0.6rem;
      border-radius: 30px;
      border: 1px solid #314f78;
    }

    .field input,
    .field select {
      background: #0d1628;
      border: 1px solid #2d4062;
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      color: #f0f6ff;
      font-size: 1rem;
      font-weight: 500;
      transition: 0.15s ease;
      outline: none;
      width: 100%;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .field input:focus,
    .field select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2), 0 4px 12px rgba(0,0,0,0.4);
      background: #101b30;
    }
    .field input::placeholder {
      color: #456185;
      font-weight: 400;
    }
    .field select option {
      background: #1a263b;
    }

    .btn {
      background: linear-gradient(135deg, #3b82f6, #4f8df7);
      border: none;
      border-radius: 60px;
      padding: 0.95rem 2rem;
      font-weight: 600;
      font-size: 1.05rem;
      color: white;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border: 1px solid #6a9dfa;
      box-shadow: 0 8px 18px -6px rgba(59, 130, 246, 0.4);
      width: 100%;
      letter-spacing: 0.01em;
    }
    .btn:hover {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      transform: scale(1.01);
      box-shadow: 0 12px 28px -8px rgba(59, 130, 246, 0.6);
      border-color: #8eb4ff;
    }
    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #1e314b;
      border: 1px solid #34507a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      color: #d6e5ff;
    }
    .btn-secondary:hover {
      background: #2a4062;
      border-color: #4b6e9e;
      color: white;
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
      transform: scale(1.01);
    }

    .keys-output {
      background: #0c1629;
      border-radius: 1.8rem;
      padding: 1.8rem 1.5rem;
      margin: 2rem 0 0.8rem 0;
      border: 1px solid #2b3f60;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
    }

    .keys-output .label {
      color: #aec6ed;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e3250;
      padding-bottom: 0.6rem;
    }
    .keys-output .label span:last-child {
      background: #1b2d4a;
      padding: 0.1rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #b7d0fc;
      border: 1px solid #2d4a73;
    }

    .key-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 0.3rem;
      margin-bottom: 0.8rem;
    }

    .key-list::-webkit-scrollbar {
      width: 5px;
    }
    .key-list::-webkit-scrollbar-track {
      background: #0f1d34;
      border-radius: 12px;
    }
    .key-list::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 12px;
      border: 1px solid #1d3f77;
    }

    .key-item {
      background: #101f38;
      padding: 0.75rem 1.2rem;
      border-radius: 14px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #e7efff;
      letter-spacing: 0.02em;
      border-left: 4px solid #3b82f6;
      word-break: break-all;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.1s ease;
      border: 1px solid #293f62;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .key-item:hover {
      background: #152843;
      border-color: #3f6bb0;
    }

    .key-item .copy-btn {
      background: #1a2d4a;
      border: 1px solid #3a5a86;
      color: #c5daff;
      border-radius: 30px;
      padding: 0.2rem 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.12s ease;
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      margin-left: 0.8rem;
      letter-spacing: 0.02em;
    }
    .key-item .copy-btn:hover {
      background: #2e4b78;
      border-color: #5f86c7;
      color: white;
      transform: scale(1.04);
    }
    .key-item .copy-btn:active {
      transform: scale(0.92);
    }

    .empty-keys {
      color: #476084;
      font-style: italic;
      text-align: center;
      padding: 1.6rem 0;
      font-size: 0.95rem;
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 0.7rem;
    }
    .actions .btn {
      flex: 1;
      min-width: 110px;
      padding: 0.7rem 0.8rem;
      font-size: 0.85rem;
    }

    .toast {
      background: #1b304f;
      border: 1px solid #4f7bcb;
      color: #e3efff;
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.2rem;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.2s ease;
      pointer-events: none;
      transform: translateY(6px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      font-weight: 500;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 2rem;
      color: #3f5b83;
      font-size: 0.7rem;
      border-top: 1px solid #253b5a;
      padding-top: 1.4rem;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .footer-note code {
      background: #141f38;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      color: #869fc9;
      font-size: 0.7rem;
      border: 1px solid #2e4468;
    }

    /* responsive */
    @media (max-width: 580px) {
      .card { padding: 1.8rem; }
      h1 { font-size: 1.8rem; }
      h1 small { font-size: 0.8rem; padding: 0.1rem 0.6rem; }
      .inline-group { flex-direction: column; gap: 0.8rem; }
      .field { min-width: 100%; }
      .actions { flex-direction: column; }
      .key-item { font-size: 0.8rem; flex-wrap: wrap; gap: 0.4rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">
    <span>⚡</span> developer tool <span style="opacity:0.5; margin:0 0.2rem;">·</span> v2.1
  </div>

  <div class="header-row">
    <h1>
      <span>⚙️ Key Generator</span>
      <small>GymManagerPro</small>
    </h1>
  </div>
  <div class="subhead">
    Generate valid activation keys — all processing happens in your browser.
    <span class="pill">🔒 no server</span>
  </div>

  <div class="form-grid">
    <div class="inline-group">
      <div class="field">
        <label>🔢 Count <span class="unit-badge">keys</span></label>
        <input type="number" id="keyCount" value="1" min="1" max="100" />
      </div>
      <div class="field">
        <label>⏱️ Amount <span class="unit-badge">validity</span></label>
        <input type="number" id="validityAmount" value="30" min="1" />
      </div>
      <div class="field">
        <label>📆 Unit</label>
        <select id="validityUnit">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          <option value="days" selected>Days</option>
        </select>
      </div>
    </div>
  </div>

  <button class="btn" id="generateBtn">
    <span>✨</span> Generate Keys
  </button>

  <div class="keys-output" id="keysOutput">
    <div class="label">
      <span>📋 generated keys</span>
      <span id="keyCountLabel">0 keys</span>
    </div>
    <div id="keyListContainer" class="key-list">
      <div class="empty-keys">No keys generated yet.</div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="copyAllBtn" style="flex:2;">📄 Copy all</button>
      <button class="btn btn-secondary" id="saveFileBtn" style="flex:2;">💾 Save .txt</button>
    </div>
    <div id="toastMessage" class="toast">✓ Copied!</div>
  </div>

  <div class="footer-note">
    ⚠️  Never ship this tool to clients. Only the <code>main.py</code> / <code>.exe</code> should be distributed.
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ----- constants (mirror Python logic) -----
    const SECRET_KEY = new TextEncoder().encode("CHANGE-ME-TO-A-LONG-RANDOM-SECRET-1f8a3c9d7e2b4a10");
    const PAYLOAD_STRUCT = ">II"; 
    const SIG_LEN = 6;

    const UNIT_SECONDS = {
      minutes: 60,
      hours: 3600,
      days: 86400
    };

    // ----- Base32 encoding (RFC 4648) -----
    function base32Encode(data) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      let bits = 0;
      let value = 0;
      let output = "";

      for (let i = 0; i < data.length; i++) {
        value = (value << 8) | data[i];
        bits += 8;
        while (bits >= 5) {
          output += alphabet[(value >>> (bits - 5)) & 31];
          bits -= 5;
        }
      }
      if (bits > 0) {
        output += alphabet[(value << (5 - bits)) & 31];
      }
      return output;
    }

    // ----- crypto helpers -----
    async function hmacSha256(key, message) {
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        key,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const sig = await crypto.subtle.sign("HMAC", cryptoKey, message);
      return new Uint8Array(sig);
    }

    function uint32ToBytes(val) {
      const buf = new ArrayBuffer(4);
      new DataView(buf).setUint32(0, val, false);
      return new Uint8Array(buf);
    }

    function concatUint8Arrays(a, b) {
      const result = new Uint8Array(a.length + b.length);
      result.set(a, 0);
      result.set(b, a.length);
      return result;
    }

    // ----- key generation (mirrors Python exactly) -----
    async function generateKey(validitySeconds) {
      const validityBytes = uint32ToBytes(validitySeconds);
      const nonce = crypto.getRandomValues(new Uint32Array(1))[0];
      const nonceBytes = uint32ToBytes(nonce);

      const payload = concatUint8Arrays(validityBytes, nonceBytes);
      const fullSig = await hmacSha256(SECRET_KEY, payload);
      const sig = fullSig.slice(0, SIG_LEN);

      const raw = concatUint8Arrays(payload, sig);
      let b32 = base32Encode(raw);
      b32 = b32.replace(/=+$/, '');

      const groups = [];
      for (let i = 0; i < b32.length; i += 4) {
        groups.push(b32.substring(i, i + 4));
      }
      return groups.join("-");
    }

    // ----- UI logic -----
    const keyCountInput = document.getElementById('keyCount');
    const validityAmountInput = document.getElementById('validityAmount');
    const validityUnitSelect = document.getElementById('validityUnit');
    const generateBtn = document.getElementById('generateBtn');
    const keyListContainer = document.getElementById('keyListContainer');
    const keyCountLabel = document.getElementById('keyCountLabel');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const saveFileBtn = document.getElementById('saveFileBtn');
    const toast = document.getElementById('toastMessage');

    let currentKeys = [];

    function renderKeys(keys) {
      currentKeys = keys;
      if (!keys || keys.length === 0) {
        keyListContainer.innerHTML = `<div class="empty-keys">No keys generated yet.</div>`;
        keyCountLabel.textContent = '0 keys';
        return;
      }

      let html = '';
      keys.forEach((k, idx) => {
        html += `
          <div class="key-item">
            <span>${k}</span>
            <button class="copy-btn" data-key="${k}" data-idx="${idx}">📋 Copy</button>
          </div>
        `;
      });
      keyListContainer.innerHTML = html;
      keyCountLabel.textContent = `${keys.length} key${keys.length > 1 ? 's' : ''}`;

      document.querySelectorAll('.key-item .copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const key = this.getAttribute('data-key');
          copyToClipboard(key, `Key ${parseInt(this.getAttribute('data-idx')) + 1} copied`);
        });
      });
    }

    function copyToClipboard(text, successMsg = 'Copied!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg);
        }).catch(() => {
          fallbackCopy(text, successMsg);
        });
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      ta.style.pointerEvents = 'none';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (e) {
        showToast('Could not copy');
      }
      document.body.removeChild(ta);
    }

    let toastTimeout = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // ---- main generation ----
    async function handleGenerate() {
      const count = parseInt(keyCountInput.value, 10) || 1;
      const amount = parseInt(validityAmountInput.value, 10) || 30;
      const unit = validityUnitSelect.value;
      const validitySeconds = amount * UNIT_SECONDS[unit];

      if (count < 1) {
        showToast('Count must be at least 1');
        return;
      }
      if (amount < 1) {
        showToast('Validity amount must be at least 1');
        return;
      }
      if (count > 200) {
        showToast('Maximum 200 keys at a time');
        return;
      }

      const keys = [];
      for (let i = 0; i < count; i++) {
        const k = await generateKey(validitySeconds);
        keys.push(k);
      }

      renderKeys(keys);
      showToast(`Generated ${keys.length} key${keys.length > 1 ? 's' : ''}`);
    }

    // ---- copy all ----
    function copyAll() {
      if (!currentKeys || currentKeys.length === 0) {
        showToast('No keys to copy');
        return;
      }
      const text = currentKeys.join('\n');
      copyToClipboard(text, `Copied ${currentKeys.length} keys`);
    }

    // ---- save as .txt ----
    function saveToFile() {
      if (!currentKeys || currentKeys.length === 0) {
        showToast('No keys to save');
        return;
      }
      const content = currentKeys.join('\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `keys_${new Date().toISOString().slice(0,10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('File saved');
    }

    // ---- event binding ----
    generateBtn.addEventListener('click', handleGenerate);
    copyAllBtn.addEventListener('click', copyAll);
    saveFileBtn.addEventListener('click', saveToFile);

    [keyCountInput, validityAmountInput, validityUnitSelect].forEach(el => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          generateBtn.click();
        }
      });
    });

    // ---- prefill with one key on load ----
    window.addEventListener('DOMContentLoaded', () => {
      handleGenerate();
    });

  })();
</script>

</body>
</html>
